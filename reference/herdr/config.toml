onboarding = false

[ui]

# >>> herdr-radar tab-bar block
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = 'command', command = 'cat "$HOME/.local/state/herdr/plugins/hhdebb.herdr-radar/tabbar.txt"', interval_seconds = 6, timeout_seconds = 2 },
]
# <<< herdr-radar tab-bar block

agent_panel_sort = "spaces"
sidebar_max_width = 50   # default 36; auto-width grows to fit names up to this cap

[experimental]
kitty_graphics = true

[keys]
prefix = "ctrl+backslash"
next_agent = "prefix+ctrl+n"          # jump to the next agent row
previous_agent = "prefix+ctrl+p"      # ...and back
last_pane = "prefix+semicolon"        # tmux-style back-and-forth between two panes
switch_workspace = "prefix+shift+1..9"

# >>> herdr-radar theme block
[theme.custom]
active_row_bg = "#414868"
# <<< herdr-radar theme block

# >>> herdr-radar sidebar block
[ui.sidebar.agents]
