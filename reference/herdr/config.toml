# <<< herdr-radar sidebar block

# ---- tsk: your task queue ----
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-tsk.open-board"
description = "tsk: open board"

[[keys.command]]
key = "prefix+ctrl+t"
type = "plugin_action"
command = "herdr-tsk.quick-capture"
description = "tsk: quick capture (selection prefills title)"

# ---- memex: past sessions ----
[[keys.command]]
key = "prefix+slash"
type = "plugin_action"
command = "nicosuave.memex.palette"
description = "memex: session palette"

[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "nicosuave.memex.recent-here"
description = "memex: recent sessions in this repo"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "nicosuave.memex.resume-last"
description = "memex: resume last session here"

# ---- reviewr: diff review ----
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr: toggle diff review"

# ---- annotate: feedback on text, docs, replies ----
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate: comment on selection"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "annotate: copy all as context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "annotate: copy all, then archive"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "annotate: manage annotations"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "annotate.open"
description = "annotate: review markdown in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "annotate: review agent's recent replies"

[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "annotate.last-newest"
description = "annotate: review agent's newest reply"

# ---- terminal-browser ----
[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "zenbu-labs.terminal-browser.open-split"
description = "browser: open in right split"

# ---- herdr-projects: coordinator + threads ----
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-projects.overview"
description = "projects: who needs me"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-projects.open"
description = "projects: open a project"

# ---- herdr-radar ----
[[keys.command]]
key = "prefix+period"
type = "plugin_action"
command = "hhdebb.herdr-radar.view-flip"
description = "radar: grouped <-> recent"

[[keys.command]]
key = "prefix+comma"
type = "plugin_action"
command = "hhdebb.herdr-radar.settings"
description = "radar: settings"
